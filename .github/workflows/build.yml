name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows x64 单文件
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 发布
        run: >
          dotnet publish MiLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: 生成校验和
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/MiLauncher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MiLauncher.exe" | Set-Content -Encoding ascii publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-win-x64
          path: |
            publish/MiLauncher.exe
            publish/SHA256SUMS.txt
          retention-days: 14

  release:
    name: 发布 Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiLauncher-win-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MiLauncher.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
